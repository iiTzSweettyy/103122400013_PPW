<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1><img src="image.png" width="100"></h1>
        <h1>Youtube Downloader</h1>
        <div class="link-panduan">
            <a href="cara-menggunakan.html">bagaimana cara menggunakan?</a>
        </div>
        <form id="download-form">
            <label for="video-url">Enter YouTube Video URL:</label>
            <input type="url" id="yt-url" name="url" placeholder="Tempelkan tautan video Anda di sini..." required>
            <button type="submit">Download</button>
        </form>
        <div id="download-link"></div>
    </div>

    <h2>Preview Video</h2>
    <div class="video-card">
        <img src="images 2.jpg" alt="Thumbnail Video YouTube">
        <h3>Judul Video</h3>
        <p><strong>Channel:</strong> Nama Channel | <strong>Durasi:</strong> 00:00</p>
    </div>

    <h2>Opsi Unduhan</h2>
    <form action="/download" method="POST" class="mt-4 p-4 bg-white border rounded shadow-sm"
        style="max-width: 500px; margin: 0 auto 40px auto; display: block;">
        <input type="hidden" name="processed-url" value="">
        <div class="text-center mb-3">
            <label for="format" class="form-label fw-bold text-dark">Pilih Format & Resolusi:</label>
        </div>
        <select class="form-select form-select-lg mb-4" id="format" name="format">
            <optgroup label="Video (MP4)">
                <option value="mp4-1080">1080p (FHD)</option>
                <option value="mp4-720">720p (HD)</option>
            </optgroup>
            <optgroup label="Audio Saja">
                <option value="mp3-320">MP3 (320kbps)</option>
            </optgroup>
        </select>
        <button type="submit" class="btn btn-success btn-lg w-100">Unduh Sekarang</button>
    </form>

    <h2>Riwayat Unduhan Terakhir</h2>
    <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; max-width: 750px;">
        <thead>
            <tr>
                <th>No</th>
                <th>Judul Video</th>
                <th>Format</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="history-tbody">
            <tr>
                <td colspan="5" style="text-align: center;">Memuat riwayat unduhan...</td>
            </tr>
        </tbody>
    </table>
    <script src="app.js"></script>
</body>

</html>
